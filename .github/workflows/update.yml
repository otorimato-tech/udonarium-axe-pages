name: Update Udonarium Axe

on:
  schedule:
    - cron: "0 */6 * * *"  # 6時間ごとにチェック
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pages repo
        uses: actions/checkout@v3

      - name: Get latest release info
        id: release
        uses: actions/github-script@v6
        with:
          script: |
            const res = await github.rest.repos.getLatestRelease({
              owner: "xelltis",
              repo: "udonarium_axe"
            });
            core.setOutput("url", res.data.assets[0].browser_download_url);

      - name: Download latest build
        run: |
          curl -L ${{ steps.release.outputs.url }} -o axe.zip

      - name: Unzip build
        run: |
          rm -rf axe_dist
          mkdir axe_dist
          unzip axe.zip -d axe_dist

      - name: Patch backend URL
        run: |
          sed -i 's#"url": ""#"url": "https://udonarium-backend.otorimato.workers.dev"#' axe_dist/assets/config.json

      - name: Replace Pages content
        run: |
          rm -rf *
          cp -r axe_dist/* .

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto update Axe" || echo "No changes to commit"
          git push
